services:
  - type: web
    name: startuppulse-api
    runtime: python
    rootDir: deploy
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STARTUPPULSE_API_KEY
        generateValue: true
